global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'focusshield-web'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000'] 
        # Using host.docker.internal to reach the Next.js app running on host.
        # In production, this would point to the container name.
